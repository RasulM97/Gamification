[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL is read from CVE_DATABASE_URL (see alembic/env.py);
# this value is only a local-dev fallback.
sqlalchemy.url = postgresql+psycopg2://postgres@/cve?host=/tmp/cve-pg

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
